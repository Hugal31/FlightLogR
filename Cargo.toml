[package]
name = "flightlogr"
version = "0.1.0"
edition = "2021"
description = """Rust version of the FlightLGo software from snip.
Listen for OGN APRS stream and log landing and takeoffs."""

[dependencies]
anyhow = "1.0.65"
chrono = "0.4.22"
csv = "1.1.6"
dms-coordinates = "1.1"
geo = "0.23"
itertools = "0.10.5"
pest = "2.4"
pest_derive = "2.4"
quantities = { version = "0.11", features=["duration", "length", "speed"], optional=true }

[dev-dependencies]
assert_matches = "1.5"
float_eq = "1.0"
socketpair = "0.16"

[features]
default = ["quantities"]
